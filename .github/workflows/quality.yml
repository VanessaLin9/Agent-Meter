name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    # PR #1: 固定顯示 Quality (macOS) / Quality (Linux)；admin 加 required checks 時用實際 check-run name，不要猜組合字串。
    name: Quality (${{ matrix.os-name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            os-name: macOS
          - os: ubuntu-latest
            os-name: Linux
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          python-version-file: ".python-version"
          enable-cache: true

      - name: Run quality checks
        # PR #1: 呼叫 scripts/quality.sh，避免本機與 CI 指令分岔。
        run: bash scripts/quality.sh
