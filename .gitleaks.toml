title = "Agent Meter secret scanning policy"
description = "Default Gitleaks rules plus Agent Meter provider-token patterns."
minVersion = "8.30.1"

[extend]
useDefault = true

[[rules]]
id = "agent-meter-sensitive-assignment"
description = "Potential credential assigned to a sensitive field"
regex = '''(?i)(?:cursorAuth/accessToken|access[_-]?token|refresh[_-]?token|api[_-]?key|client[_-]?secret|authorization)[\t "']{0,8}(?:=|:)[\t "']{0,8}([A-Za-z0-9_./+~=-]{16,})'''
secretGroup = 1
entropy = 3.0
keywords = [
  "access_token",
  "accesstoken",
  "refresh_token",
  "api_key",
  "apikey",
  "client_secret",
  "authorization"
]

[[rules]]
id = "agent-meter-bearer-token"
description = "Potential bearer credential"
regex = '''(?i)bearer[\t ]+([A-Za-z0-9._~+/-]{20,}={0,2})'''
secretGroup = 1
entropy = 3.0
keywords = ["bearer"]
