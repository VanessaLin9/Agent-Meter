[project]
name = "agent-meter"
version = "0.1.0"
description = "Local Collector for Agent Meter usage snapshots."
readme = "README.md"
requires-python = ">=3.12,<3.13"
# FastAPI waits for the HTTP API task. jsonschema is test-only (dev group).
dependencies = [
    "pydantic==2.13.5",
]

[build-system]
# PR #1: Hatchling 精確版本寫在 build-system，不假設 uv.lock 鎖住隔離 build 工具。
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "jsonschema==4.26.0",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "ruff==0.16.7",
    "types-jsonschema==4.26.0.20260518",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_meter"]

[tool.uv]
package = true
# PR #1: 與 README / setup-uv version 一致；驗證時禁止隱式升級 uv。
required-version = "==0.12.13"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["agent_meter"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# PR #1: importlib mode，不用 PYTHONPATH 讓未安裝的 src layout 碰巧通過。
addopts = ["-ra", "--import-mode=importlib"]
